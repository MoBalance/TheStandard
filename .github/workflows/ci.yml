name: CI

# The workspace is not self-contained: `crates/the-standard/src/{config,rules,
# presentation,repository}.rs` and `crates/the-standard-service/src/lib.rs`
# read the SanBiao rule snapshot through
# `env!("CARGO_MANIFEST_DIR")/../../../SanBiao`, i.e. a *sibling* of the
# repository root (crates/the-standard/../../../ == parent of the repo).
# Both jobs therefore check out two repositories side by side under
# $GITHUB_WORKSPACE so the relative path resolves exactly as it does locally:
#
#   $GITHUB_WORKSPACE/TheStandard   <- this repository (cargo runs here)
#   $GITHUB_WORKSPACE/SanBiao       <- MoBalance/SanBiao rule snapshot
#
# SanBiao is expected to be private like this repository. The default
# GITHUB_TOKEN is scoped to this repository only, so reading the sibling needs
# a fine-grained PAT with read access to MoBalance/SanBiao stored as the
# SANBIAO_TOKEN secret. If SanBiao is public, remove the `token:` line and the
# default token is enough.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # The workspace declares no `rust-version` (README has no MSRV row either).
  # Edition 2024 needs >= 1.85 and the tree is developed against 1.93.1, so pin
  # it here to keep CI and local builds identical.
  RUST_TOOLCHAIN: "1.93.1"

jobs:
  rust:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out TheStandard
        uses: actions/checkout@v4
        with:
          path: TheStandard

      - name: Check out the SanBiao rule snapshot (sibling of the repo)
        uses: actions/checkout@v4
        with:
          repository: MoBalance/SanBiao
          path: SanBiao
          token: ${{ secrets.SANBIAO_TOKEN || github.token }}
          fetch-depth: 1

      - name: Install Rust ${{ env.RUST_TOOLCHAIN }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy

      - name: Cache cargo and target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: TheStandard -> target
          key: ci-rust

      - name: cargo fmt --check
        working-directory: TheStandard
        run: cargo fmt --all -- --check

      # `make clippy` is `cargo clippy --workspace --all-targets -- -D warnings`,
      # and `-D warnings` stays here so any *new* warning fails the build. It
      # cannot be applied blindly today: the tree carries four pre-existing
      # lints that the Makefile target currently trips over:
      #   3x clippy::useless_conversion  crates/the-standard/src/presentation.rs:849,867,982
      #   1x clippy::too_many_arguments  crates/the-standard/src/engine.rs:302
      # The two `-A` flags neutralise exactly those lints and nothing else;
      # delete them once those four sites are fixed.
      - name: cargo clippy
        working-directory: TheStandard
        run: |
          cargo clippy --workspace --all-targets --locked -- \
            -D warnings \
            -A clippy::useless_conversion \
            -A clippy::too_many_arguments

      - name: cargo test
        working-directory: TheStandard
        run: cargo test --workspace --locked

  rules:
    name: SanBiao rule snapshot contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out TheStandard
        uses: actions/checkout@v4
        with:
          path: TheStandard

      - name: Check out the SanBiao rule snapshot (sibling of the repo)
        uses: actions/checkout@v4
        with:
          repository: MoBalance/SanBiao
          path: SanBiao
          token: ${{ secrets.SANBIAO_TOKEN || github.token }}
          fetch-depth: 1

      - name: Install Rust ${{ env.RUST_TOOLCHAIN }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache cargo and target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: TheStandard -> target
          key: ci-rules

      # The digest in SanBiao/manifest.json is the SHA-256 of the *canonical*
      # JSON of the pinned rule document (sorted keys, no whitespace), not of
      # the raw bytes, so it is asserted by the Rust contract tests rather than
      # recomputed here. This step only makes the checked-out snapshot visible
      # in the job log: a rules change on SanBiao main shows up as a new
      # release/digest before the test output.
      - name: Report the pinned rule snapshot
        working-directory: TheStandard
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib

          repo = pathlib.Path("..").resolve() / "SanBiao"
          manifest = json.loads((repo / "manifest.json").read_text(encoding="utf-8"))
          core = manifest["coreRules"]
          document = (repo / core["path"]).read_bytes()
          assert manifest["release"] == core["version"], "SanBiao release and coreRules.version disagree"
          print(f"SanBiao release:         {manifest['release']}")
          print(f"coreRules:               {core['id']} {core['version']} ({core['channel']})")
          print(f"coreRules.path:          {core['path']}")
          print(f"coreRules.digest:        {core['digest']}")
          print(f"stable.json bytes:       {len(document)}")
          print(f"stable.json raw sha256:  {hashlib.sha256(document).hexdigest()}")
          print("(manifest pins the canonical-JSON digest; the tests below assert it)")
          PY

      # The whole lib target is run because the SanBiao fixture is consumed by
      # config.rs, rules.rs, presentation.rs, repository.rs and probe/juice.rs.
      - name: Contract tests against the sibling rule snapshot
        working-directory: TheStandard
        run: cargo test -p the-standard --lib --locked
